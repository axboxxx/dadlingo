    .steps { position: absolute; left: 25px; bottom: 24px; width: 136px; height: 105px; }
    .step { position: absolute; bottom: 0; height: 32px; border: 3px solid #5b7180; border-radius: 5px 5px 0 0; background: #d9e3e8; }

    .bucket::before { position: absolute; left: 8px; top: -32px; width: 46px; height: 38px; border: 4px solid #315f84; border-bottom: 0; border-radius: 30px 30px 0 0; content: ""; }
    .clue-card { position: absolute; width: 56px; height: 44px; padding: 5px; border: 2px solid #8a6d22; border-radius: 5px; background: #fff1a8; box-shadow: 2px 3px rgba(23,59,87,.15); font-size: 11px; font-weight: 900; text-align: center; transform: rotate(-5deg); }
    .clue-card.first { left: 178px; bottom: 42px; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 4px solid rgba(246,129,75,.35); outline-offset: 2px; }
    @media (max-width: 430px) {
      .shell { padding: 10px 10px 24px; }

<body>
  <main class="shell">
    <div class="sample-flag">SAMPLE · 未接入主遊戲</div>
    <div class="topbar" aria-label="課堂進度">
      <button class="icon-button" id="restartTop" type="button" title="重新開始" aria-label="重新開始">↻</button>
      <div class="progress-track" role="progressbar" aria-label="完成進度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 6</div>
    </div>

    <details class="tester-tools" id="testerTools">
      <summary>🧪 Tester：跳關</summary>
      <div class="jump-panel">
        <p>直接檢查指定畫面；使用跳關後，本次結果只作測試。</p>
        <div class="jump-grid" aria-label="選擇測試關卡">
          <button class="jump-button" type="button" data-jump-stage="welcome">起點</button>
          <button class="jump-button" type="button" data-jump-stage="meaning">1 · 字義</button>
          <button class="jump-button" type="button" data-jump-stage="matching">2 · 配對</button>
          <button class="jump-button" type="button" data-jump-stage="reading">3 · 閱讀</button>
          <button class="jump-button" type="button" data-jump-stage="main">4 · 理解</button>
          <button class="jump-button" type="button" data-jump-stage="transfer">5 · 轉用</button>
          <button class="jump-button" type="button" data-jump-stage="complete">6 · 完成</button>
        </div>
      </div>
    </details>

    <section class="card" id="app" aria-live="polite"></section>
  </main>

  <script id="lesson-data" type="application/json">{"title_zh":"遊樂場尋寶","title_en":"Playground treasure trail","segments":["第一條線索說：走上三級樓梯。","第二條線索說：找一個可以裝水的東西。","你探索四周，看見一個水桶。"],"translation_en":"The first clue says to walk up three steps. The second says to find something that can hold water. You explore and see a bucket.","question":"Which object satisfies the second clue?","choices":["The bucket","The steps","The lunch box"],"correct":0,"answer_rationale":"The bucket is the only named object made to carry water.","choice_rationales":["It matches the water clue.","The steps satisfy the first clue only.","No lunch box appears."],"transfer":"水桶放在梯級前，旁邊的線索叫大家先探索另一條路。","transfer_question":"What should the group do before using the blocked steps?","transfer_choices":["Explore the other route","Climb over the bucket","Ignore the clue"],"transfer_correct":0,"transfer_answer_rationale":"The new clue redirects the group because the steps are blocked.","transfer_choice_rationales":["This follows both the clue and the obstacle.","The text does not say climbing over it is safe.","Ignoring the clue defeats the stated plan."],"visual_purpose":"evidence","visual_visibility":"after_scored_response","visual_brief":"A playground with three steps, two clue cards and a bucket among ordinary objects.","visual_must_show":["three steps","two clue cards","bucket"],"visual_must_not_show":["visible treasure","arrow to answer"],"meanings":{"梯級":"step or stair","線索":"clue","探索":"to explore","水桶":"bucket"}}</script>
  <script>
    "use strict";
    const lesson = JSON.parse(document.getElementById("lesson-data").textContent);
    const app = document.getElementById("app");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const progressTrack = document.querySelector("[role=progressbar]");
    const stages = ["welcome", "meaning", "matching", "reading", "main", "transfer", "complete"];
    const state = { stage: "welcome", wrongAttempts: 0, mainUnlocked: false, testerJumped: false };

    const ui = {
      meaningQuestion: "『探索』在這一課是甚麼意思？",
      meaningChoices: ["仔細看看四周，尋找新發現", "站着不動，甚麼也不看", "把東西收藏起來"],
      matching: [
        ["樓梯上一級一級的位置", "梯級"],
        ["幫助你找答案的提示", "線索"],
        ["仔細看看四周，尋找新發現", "探索"],
        ["可以盛水的器具", "水桶"]
      ],
      mainQuestion: "第二條線索要找哪一件東西？",
      mainChoices: ["水桶", "梯級", "飯盒"],
      transferQuestion: "用被水桶擋住的梯級前，大家應該先做甚麼？",
      transferChoices: ["探索另一條路", "跨過水桶", "不理會線索"]
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char]);
    }

    function updateProgress() {
      const position = stages.indexOf(state.stage);
      const completed = Math.max(0, Math.min(6, position));
      progressFill.style.width = `${completed / 6 * 100}%`;
      progressLabel.textContent = `${completed} / 6`;
      progressTrack.setAttribute("aria-valuenow", String(completed));
    }

    function setStage(next) {
      state.stage = next;
      updateProgress();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      requestAnimationFrame(() => app.querySelector("h1, h2")?.focus());
    }

    function heading(kicker, title, body = "") {
      return `<p class="eyebrow">${escapeHtml(kicker)}</p><h2 tabindex="-1">${escapeHtml(title)}</h2>${body ? `<p class="lead">${escapeHtml(body)}</p>` : ""}`;
    }

    function feedback(kind, text) {
      const node = document.getElementById("feedback");
      node.className = `feedback ${kind}`;
      node.textContent = text;
    }

    function renderWelcome() {
      app.innerHTML = `
        <p class="eyebrow">E03 · 完整試玩課</p>
        <h1 tabindex="-1">${escapeHtml(lesson.title_zh)}</h1>
        <p class="lead">跟着兩張線索卡，找出正確物件，再決定下一步怎樣走。</p>
        <div class="mission"><div class="mission-icon" aria-hidden="true">🧭</div><div><strong>今日任務</strong><span>學懂 4 個詞語，完成 2 次判斷。</span></div></div>
        <div class="word-chips" aria-label="今課詞語">${Object.keys(lesson.meanings).map(w => `<span class="word-chip">${escapeHtml(w)}</span>`).join("")}</div>
        <div class="notice">🔇 音訊尚未通過審核；今次 sample 不設聽力評分。</div>
        <div class="button-row"><button class="primary" id="start" type="button">開始尋寶</button></div>`;
      document.getElementById("start").addEventListener("click", () => setStage("meaning"));
    }

    function renderMeaning() {
      app.innerHTML = `${heading("第 1 關 · 字義", ui.meaningQuestion, "先掌握詞語，之後先讀線索。")}
        <div class="choice-grid">${ui.meaningChoices.map((choice, index) => `<button class="choice" data-answer="${index}" type="button">${escapeHtml(choice)}</button>`).join("")}</div>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="button-row"><button class="primary" id="continue" type="button" hidden>下一關：詞語配對</button></div>`;
      app.querySelectorAll(".choice").forEach(button => button.addEventListener("click", () => {
        app.querySelectorAll(".choice").forEach(item => item.classList.remove("wrong"));
        if (Number(button.dataset.answer) === 0) {
          button.classList.add("correct");
          app.querySelectorAll(".choice").forEach(item => item.disabled = true);
          feedback("good", "答對！探索就是仔細看看四周，尋找新發現。");
          document.getElementById("continue").hidden = false;
        } else {
          state.wrongAttempts += 1;
          button.classList.add("wrong");
          feedback("bad", "未啱，再想想：尋寶時，我們要怎樣找新發現？");
        }
      }));
      document.getElementById("continue").addEventListener("click", () => setStage("matching"));
    }

    function renderMatching() {
      const options = ["", ...Object.keys(lesson.meanings)];
      app.innerHTML = `${heading("第 2 關 · 配對", "把解釋配上詞語", "每個詞語只用一次。")}
        <div class="match-list">${ui.matching.map(([definition], index) => `<div class="match-row" data-row="${index}"><label for="match-${index}">${escapeHtml(definition)}</label><select id="match-${index}"><option value="">請選擇</option>${options.slice(1).map(word => `<option value="${escapeHtml(word)}">${escapeHtml(word)}</option>`).join("")}</select></div>`).join("")}</div>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="button-row"><button class="primary" id="checkMatch" type="button">檢查配對</button><button class="primary" id="continue" type="button" hidden>下一關：閱讀線索</button></div>`;
      document.getElementById("checkMatch").addEventListener("click", () => {
        const chosen = ui.matching.map((_, index) => document.getElementById(`match-${index}`).value);
        const complete = chosen.every(Boolean);
        const unique = new Set(chosen).size === chosen.length;
        let allCorrect = complete && unique;
        ui.matching.forEach(([, answer], index) => {
          const row = app.querySelector(`[data-row="${index}"]`);
          row.classList.remove("correct", "wrong");
          const correct = chosen[index] === answer;
          row.classList.add(correct ? "correct" : "wrong");
          allCorrect = allCorrect && correct;
        });
        if (allCorrect) {
          feedback("good", "四組都答對！你已經認得今課詞語。");
          app.querySelectorAll("select").forEach(select => select.disabled = true);
          document.getElementById("checkMatch").hidden = true;
          document.getElementById("continue").hidden = false;
        } else {
          state.wrongAttempts += 1;
          feedback("bad", complete && !unique ? "每個詞語只可用一次，再試試。" : "有配對未啱。紅色項目可以再想一想。");
        }
      });
      document.getElementById("continue").addEventListener("click", () => setStage("reading"));
    }

    function renderReading() {
      app.innerHTML = `${heading("第 3 關 · 閱讀", "讀出三步線索", "留意第一條和第二條線索要找的東西不同。")}
        <ol class="story">${lesson.segments.map(segment => `<li>${escapeHtml(segment)}</li>`).join("")}</ol>
        <button class="secondary" type="button" disabled aria-describedby="audioNote">🔇 音訊尚未可用</button>
        <p class="notice" id="audioNote">未有 approved audio，所以本課只測閱讀理解，不計聽力分。</p>
        <div class="button-row"><button class="primary" id="continue" type="button">我讀完了</button></div>`;
      document.getElementById("continue").addEventListener("click", () => setStage("main"));
    }

    function evidenceUnlock() {
      return `<div class="unlock" id="evidenceUnlock">
        <h3>🔓 證據圖及 English support 已解鎖</h3>
        <p>第二條線索說要找「可以裝水的東西」，而文中看見的是水桶。</p>
        <div class="scene" role="img" aria-label="遊樂場有三級梯級、兩張線索卡和一個水桶，沒有顯示寶藏或答案箭嘴">
          <div class="sun"></div><div class="steps"><div class="step one"></div><div class="step two"></div><div class="step three"></div></div>
          <div class="clue-card first">線索 1</div><div class="clue-card second">線索 2</div><div class="bucket"></div>
        </div>
        <p class="scene-caption">圖中保留兩條線索的證據，但沒有顯示寶藏或答案箭嘴。</p>
        <div class="english-support"><strong>English support</strong><p>${escapeHtml(lesson.translation_en)}</p></div>
      </div>`;
    }

    function renderMain() {
      app.innerHTML = `${heading("第 4 關 · 理解", ui.mainQuestion, "根據剛才讀過的第二條線索選答案。")}
        <div class="choice-grid">${ui.mainChoices.map((choice, index) => `<button class="choice" data-answer="${index}" type="button">${escapeHtml(choice)}</button>`).join("")}</div>
        <p class="feedback" id="feedback" role="status"></p>
        <div id="unlockSlot"></div>
        <div class="button-row"><button class="primary" id="continue" type="button" hidden>下一關：情境轉用</button></div>`;
      app.querySelectorAll(".choice").forEach(button => button.addEventListener("click", () => {
        app.querySelectorAll(".choice").forEach(item => item.classList.remove("wrong"));
        if (Number(button.dataset.answer) === lesson.correct) {
          state.mainUnlocked = true;
          button.classList.add("correct");
          app.querySelectorAll(".choice").forEach(item => item.disabled = true);
          feedback("good", "答對！水桶能夠裝水，正好符合第二條線索。");
          document.getElementById("unlockSlot").innerHTML = evidenceUnlock();
          document.getElementById("continue").hidden = false;
        } else {
          state.wrongAttempts += 1;
          button.classList.add("wrong");
          feedback("bad", Number(button.dataset.answer) === 1 ? "梯級屬於第一條線索。再找第二條線索的證據。" : "故事沒有提到飯盒。再讀第二條線索想一想。");
        }
      }));
      document.getElementById("continue").addEventListener("click", () => setStage("transfer"));
    }

    function renderTransfer() {
      app.innerHTML = `${heading("第 5 關 · 情境轉用", "情況改變了", "把剛才學到的『探索』和『線索』用在新情況。")}
        <div class="mission"><div class="mission-icon" aria-hidden="true">🪣</div><div><strong>${escapeHtml(lesson.transfer)}</strong><span>水桶擋住了原來的路。</span></div></div>
        <h3>${escapeHtml(ui.transferQuestion)}</h3>
        <div class="choice-grid">${ui.transferChoices.map((choice, index) => `<button class="choice" data-answer="${index}" type="button">${escapeHtml(choice)}</button>`).join("")}</div>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="button-row"><button class="primary" id="continue" type="button" hidden>完成課堂</button></div>`;
      app.querySelectorAll(".choice").forEach(button => button.addEventListener("click", () => {
        app.querySelectorAll(".choice").forEach(item => item.classList.remove("wrong"));
        if (Number(button.dataset.answer) === lesson.transfer_correct) {
          button.classList.add("correct");
          app.querySelectorAll(".choice").forEach(item => item.disabled = true);
          feedback("good", "答對！新線索叫大家先探索另一條路，亦不用跨過障礙物。");
          document.getElementById("continue").hidden = false;
        } else {
          state.wrongAttempts += 1;
          button.classList.add("wrong");
          feedback("bad", "這個做法沒有同時跟從線索和避開障礙物。再試一次。");
        }
      }));
      document.getElementById("continue").addEventListener("click", () => setStage("complete"));
    }

    function renderComplete() {
      app.innerHTML = `${heading("完成", "尋寶任務完成！", "你認得四個詞語，也能把線索用在新情況。")}
        ${state.testerJumped ? '<div class="notice">🧪 你曾使用跳關；這個完成畫面只作測試，不代表完成學習。</div>' : '<div class="finish-stars" aria-label="三顆星">★★★</div>'}
        <div class="summary"><div><span>已學詞語</span><strong>${state.testerJumped ? '測試模式' : '4 個'}</strong></div><div><span>完成關卡</span><strong>${state.testerJumped ? '不計分' : '6 / 6'}</strong></div><div><span>再試次數</span><strong>${state.wrongAttempts}</strong></div></div>
        <div class="notice">這是獨立 sample，成績不會寫入現有 DADLINGO 進度。</div>
        <div class="button-row"><button class="primary" id="restart" type="button">再玩一次</button></div>`;
      document.getElementById("restart").addEventListener("click", restart);
    }

    function restart() {
      state.stage = "welcome";
      state.wrongAttempts = 0;
      state.mainUnlocked = false;
      state.testerJumped = false;
      updateProgress();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      ({ welcome: renderWelcome, meaning: renderMeaning, matching: renderMatching, reading: renderReading, main: renderMain, transfer: renderTransfer, complete: renderComplete })[state.stage]();
    }

    document.getElementById("restartTop").addEventListener("click", restart);
    document.querySelectorAll("[data-jump-stage]").forEach(button => button.addEventListener("click", () => {
      state.testerJumped = true;
      setStage(button.dataset.jumpStage);
      document.getElementById("testerTools").open = false;
    }));
    updateProgress();
    render();
  </script>
</body>
</html>
